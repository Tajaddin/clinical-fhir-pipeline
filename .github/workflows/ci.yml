name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.10.4"

jobs:
  python:
    name: lint, types, unit and API tests (sqlite, fake model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=cfp --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: coverage, path: coverage.xml, retention-days: 7 }

  pipeline:
    name: Synthea 400 patients through the whole pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: .synthea, key: synthea-v4.0.0 }
      - run: uv sync
      - run: bash scripts/synthea.sh 400 42   # 100 patients gave 6 readmissions, under the 10 the model needs
      - run: CFP_DEID_SALT="$(openssl rand -hex 32)" uv run cfp pipeline --eval-patients 10
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
      - run: uv run python scripts/render_results.py --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: reports, path: reports, retention-days: 7 }

  postgres:
    name: audit store against a real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: cfp, POSTGRES_PASSWORD: cfp, POSTGRES_DB: cfp }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cfp" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/test_api.py tests/test_summaries_model_db.py -k "audit or api"
        env:
          CFP_TEST_DATABASE_URL: postgresql+psycopg://cfp:cfp@localhost:5432/cfp

  dashboard:
    name: dashboard lint, build and Playwright end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --extra dev
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npm run lint && npm run build -- --configuration production
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: fixture cohort, pipeline and API
        run: |
          uv run python scripts/e2e_fixture.py
          CFP_LAKEHOUSE_ROOT=data/e2e/lakehouse CFP_REPORTS_DIR=data/e2e/reports CFP_DATABASE_URL=sqlite:///data/e2e/cfp.db \
          CFP_API_KEYS=e2e-analyst:analyst,e2e-admin:admin CFP_LLM_BASE_URL= nohup uv run cfp serve --port 8110 >api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8110/health && break; sleep 2; done
      - run: npx playwright test
        working-directory: dashboard
        env: { API_BASE: http://localhost:8110, DASHBOARD_API_KEY: e2e-analyst }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: playwright-report, path: dashboard/playwright-report, retention-days: 7 }

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --extra dev
      - run: uv run pip-audit --skip-editable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24" }
      - run: npm audit --audit-level=high
        working-directory: dashboard

  images:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker build -t cfp/api:ci . && docker image ls cfp/api:ci --format '{{.Repository}} {{.Size}}'
      - run: docker build -t cfp/dashboard:ci dashboard && docker image ls cfp/dashboard:ci --format '{{.Repository}} {{.Size}}'
