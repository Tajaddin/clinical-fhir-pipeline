# One grouped pull request per ecosystem per month: enough to stay current without a queue of
# single-package PRs, each running the full CI.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    pip:
      patterns:
      - '*'
- package-ecosystem: npm
  directory: /dashboard
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    npm:
      patterns:
      - '*'
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    docker:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    github_actions:
      patterns:
      - '*'
- package-ecosystem: terraform
  directory: /infra/terraform
  schedule:
    interval: monthly
  cooldown:
    default-days: 7
  groups:
    terraform:
      patterns:
      - '*'
